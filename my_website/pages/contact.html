<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AMBooks is a bookstore that helps Ethiopian readers find books in Amharic and English. We offer different genres of books for all ages.">
    <title>AMBooks | Contact</title>
    <link rel="icon" href="../images/favicon.png">
</head>
<body>
    <header>
        <h1>AMBooks</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="./books.html">Books</a></li>
                <li><a href="./about.html">About</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>Contact Us</h2>
            <p>If you have any questions or inquiries, please contact us at <a href="mailto:AMHbooks@gmail.com">AMHbooks@gmail.com</a>.</p>
        </section>
        <section>
            <h2>Contact Form</h2>
            <form action="#" method="get">
                <label for="name">Full name:</label>
                <input type="text" id="name" name="name" required><br><br>
                <label>Gender:</label>
                <input type="radio"  name="gender" value="male" required>Male
                <input type="radio"  name="gender" value="female" required>Female<br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>
                <label for="birth_date" >Birth Date:</label>
                <input type="date" id="birth_date" required name="birth_date"><br><br>
                <label for="genre">Genre:</label>
                <select id="genre" name="genre">
                    <option value="">select</option>
                    <option value="Social realism">Social realism</option>
                    <option value="Philosophical Fiction">Philosophical Fiction</option>
                    <option value="Fiction">Fiction</option>
                </select><br><br>
                <label for="title">Title:</label>
                <input type="text" id="title" name="title"><br><br>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" minlength="10" maxlength="10" placeholder="e.g:0912345678"><br><br>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="30" placeholder="Enter your suggestions and books you want them to be added here..."></textarea><br><br>

                <input type="submit" value="Submit">
            </form>
        </section>
    </main><hr>
    <footer>
        <address>
            <p>Contact us at: <a href="mailto:AMbooks@gmail.com">AMbooks@gmail.com</a></p>
        </address>
        <p>&copy; 2026 AMBooks. All rights reserved.</p>
    </footer>
</body>
</html>
